name: Bug hunt (ASan+UBSan)

# 本家 FreeCAD にこのリポジトリのパッチを当て、AddressSanitizer＋UndefinedBehaviorSanitizer 付き・
# 画面なし（FreeCADCmd だけ）で作り、tools/bughunt/corpus.tsv の公開ファイルと本家の試験を流す。
# 結果は Actions の Summary と成果物 bughunt-report（report.md・findings.json・各ケースの stderr）。
# ビルドが 6 時間に収まらないときは ccache が残るので、もう一度実行すると続きから作る。
# 使い方: Actions の「Bug hunt (ASan+UBSan)」から実行（リリースとは無関係）。

on:
  workflow_dispatch:
    inputs:
      hunt_minutes:
        description: "Minutes for the corpus run (after the build)"
        default: "120"
      tests:
        description: "Test suites for FreeCADCmd -t (space separated)"
        default: "TestPartApp TestSketcherApp TestPartDesignApp MeshTestsApp TestSurfaceApp TestTechDrawApp TestSpreadsheet TestDraft TestArch TestAssemblyWorkbench TestMaterialsApp BaseTests UnitTests Document TestLinkSuppression Recompute StringHasher UnicodeTests Metadata TestIntPairList"

permissions:
  contents: read

env:
  FREECAD_BASE: b48098efaa2560d0aa989d7f6e61cdb7f831877f

jobs:
  hunt:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-android: 'true'
          remove-cached-tools: 'true'

      - name: Checkout the patches
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Fetch FreeCAD and apply the patches
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global core.autocrlf false
          git init -q FreeCAD
          cd FreeCAD
          git remote add origin https://github.com/FreeCAD/FreeCAD.git
          git fetch -q --depth 1 origin "$FREECAD_BASE"
          git checkout -q FETCH_HEAD
          git submodule update -q --init --recursive
          git am -q --keep-cr ../patches/patches/freecad/*.patch
          git -C src/3rdParty/OndselSolver am -q --keep-cr "$PWD/../patches/patches/ondselsolver/"*.patch
          git log --oneline -1

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          manifest-path: FreeCAD/pixi.toml
          cache: false
          locked: true

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: bughunt-ccache-${{ hashFiles('patches/patches/**') }}-${{ github.run_id }}
          restore-keys: |
            bughunt-ccache-${{ hashFiles('patches/patches/**') }}-
            bughunt-ccache-

      - name: Configure (ASan+UBSan, -O1 -g, no GUI)
        working-directory: FreeCAD
        run: |
          set -euo pipefail
          SAN="-fsanitize=address,undefined -fsanitize-recover=address,undefined -fno-sanitize=vptr,function -fno-omit-frame-pointer"
          pixi run --locked env CFLAGS= CXXFLAGS= DEBUG_CFLAGS= DEBUG_CXXFLAGS= \
            cmake --preset conda-linux-release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_C_FLAGS_RELEASE="-O1 -g -DNDEBUG $SAN" -DCMAKE_CXX_FLAGS_RELEASE="-O1 -g -DNDEBUG $SAN" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -shared-libasan -pthread -fuse-ld=mold" \
              -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined -shared-libasan -pthread" \
              -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address,undefined -shared-libasan -pthread" \
              -DBUILD_GUI=OFF -DBUILD_FEM=OFF -DBUILD_FEM_NETGEN=OFF -DBUILD_CAM=OFF -DBUILD_ROBOT=OFF \
              -DENABLE_DEVELOPER_TESTS=OFF > ../configure.log 2>&1 || { tail -40 ../configure.log; exit 1; }
          tail -3 ../configure.log

      - name: Build
        id: build
        working-directory: FreeCAD
        timeout-minutes: 250
        env:
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_MAXSIZE: 6G
          CCACHE_COMPRESS: "1"
        run: |
          set -euo pipefail
          pixi run --locked ninja -C build/release -j4 > ../build.log 2>&1 || { grep -E 'error|FAILED' ../build.log | head -40; tail -20 ../build.log; exit 1; }
          tail -2 ../build.log
          pixi run --locked ccache -s | head -12

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: bughunt-ccache-${{ hashFiles('patches/patches/**') }}-${{ github.run_id }}

      - name: Build LibreDWG (dwg2dxf for DWG import)
        run: |
          set -euo pipefail
          cd patches
          tools/build_libredwg.sh ../libredwg linux > ../libredwg.log 2>&1 || { tail -20 ../libredwg.log; exit 1; }
          ls ../libredwg

      - name: Fetch the corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 patches/tools/bughunt/fetch_corpus.py --out corpus --freecad-src FreeCAD | tail -25

      - name: Run the corpus and the tests
        working-directory: FreeCAD
        run: |
          set -euo pipefail
          SANLIB=$(dirname "$(pixi run --locked clang -print-file-name=libclang_rt.asan-x86_64.so)")
          SYM=$(ls /usr/bin/llvm-symbolizer* 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$SYM" ] || SYM=/usr/bin/addr2line
          echo "sanlib=$SANLIB symbolizer=$SYM"
          python3 ../patches/tools/bughunt/run_corpus.py --freecadcmd build/release/bin/FreeCADCmd \
            --list ../corpus/manifest.txt --out ../results --jobs 4 --timeout 900 --cli \
            --dwg2dxf "$(find ../libredwg -name dwg2dxf -type f | head -1)" \
            --sanlib "$SANLIB" --symbolizer "$SYM" \
            --tests "${{ inputs.tests }}" --deadline $(( ${{ inputs.hunt_minutes }} * 60 )) > ../run.log 2>&1 || true
          tail -3 ../run.log

      - name: Triage
        if: always()
        run: |
          set -euo pipefail
          [ -f results/results.jsonl ] || { echo "no results" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 patches/tools/bughunt/triage.py results --freecad-src FreeCAD --base "$FREECAD_BASE" \
            --md report.md --json findings.json
          head -c 900000 report.md >> "$GITHUB_STEP_SUMMARY"
          # stderr of the cases that matter, compressed (the full outputs stay out of the artifact)
          tar -C results -czf cases.tar.gz --exclude='*/work' cases results.jsonl
          cp corpus/sources.tsv . || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bughunt-report
          path: |
            report.md
            findings.json
            cases.tar.gz
            sources.tsv
            run.log
            build.log
          if-no-files-found: ignore
