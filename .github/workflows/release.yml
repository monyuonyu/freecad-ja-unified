name: Build release

# 本家 FreeCAD の元の版にこのリポジトリのパッチを当て、本家と同じ手順（package/bundle）で
# Linux（AppImage）と Windows（7z とインストーラー）を作ってリリースに載せる。
# 使い方: Actions の「Build release」から、タグ名（例 ja-unified-0.1.0）を入れて実行する。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. ja-unified-0.1.0)"
        required: true

permissions:
  contents: write

env:
  # パッチを当てる元の FreeCAD（apply.sh と同じ）
  FREECAD_BASE: b48098efaa2560d0aa989d7f6e61cdb7f831877f
  BUILD_TAG: ${{ inputs.tag }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release (prerelease until checked)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 元にした FreeCAD の版（version.json）を、題名・説明・ファイル名に入れる
          curl -fsSL "https://raw.githubusercontent.com/FreeCAD/FreeCAD/$FREECAD_BASE/version.json" -o version.json
          BASE_VERSION=$(python3 -c "import json; v=json.load(open('version.json')); print('%d.%d.%d%s' % (v['version_major'], v['version_minor'], v['version_patch'], v['version_suffix']))")
          BASE_SHORT=${FREECAD_BASE:0:7}
          sed -e "s/{BASE_VERSION}/$BASE_VERSION/g" -e "s/{BASE_SHORT}/$BASE_SHORT/g" \
              -e "s/{BASE_SHA}/$FREECAD_BASE/g" -e "s/{TAG}/$BUILD_TAG/g" RELEASE_NOTES.md > notes.md
          gh release create "$BUILD_TAG" --target "${{ github.sha }}" --prerelease \
            --title "freecad-ja-unified $BUILD_TAG（FreeCAD $BASE_VERSION $BASE_SHORT ベース）" --notes-file notes.md \
          || gh release view "$BUILD_TAG" > /dev/null

  # DWG の読み書き: LibreDWG（本家の版＋patches/libredwg）の dwg2dxf / dxf2dwg を作る。
  # あわせて Jw_cad の図面を読む jww2dxf（jww-tools）も作る。
  # Linux 用はこの Ubuntu で、Windows 用は MinGW-w64 でクロスビルドする（どちらも DLL 不要）
  libredwg:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build LibreDWG
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          tools/build_libredwg.sh out/linux linux
          tools/build_libredwg.sh out/win64 win64
          # Jw_cad の図面（.jww/.jws）: jww-tools の jww2dxf も同じ所に作る（create_bundle.sh が JWW_BIN から同梱する）
          tools/build_jww2dxf.sh out/linux linux
          tools/build_jww2dxf.sh out/win64 win64
      - uses: actions/upload-artifact@v4
        with:
          name: libredwg-bin
          path: out/

  build:
    needs: [release, libredwg]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-64, os: ubuntu-22.04, osfolder: linux, libredwg: linux }
          - { target: win-64, os: windows-2022, osfolder: windows, libredwg: win64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - name: Maximize build space
        if: runner.os == 'Linux'
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-android: 'true'
          remove-cached-tools: 'true'

      - name: Windows caches on drive D
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'PIXI_CACHE_DIR=D:\rattler' >> "$GITHUB_ENV"
          echo 'RATTLER_CACHE_DIR=D:\rattler' >> "$GITHUB_ENV"

      - name: Checkout the patches
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Fetch FreeCAD and apply the patches
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global core.autocrlf false
          git init -q FreeCAD
          cd FreeCAD
          git remote add origin https://github.com/FreeCAD/FreeCAD.git
          git fetch -q --depth 1 origin "$FREECAD_BASE"
          git checkout -q FETCH_HEAD
          git submodule update -q --init --recursive
          # FreeCAD のソースは CRLF のファイルが多いので --keep-cr が要る
          git am -q --keep-cr ../patches/patches/freecad/*.patch
          git -C src/3rdParty/OndselSolver am -q --keep-cr "$PWD/../patches/patches/ondselsolver/"*.patch
          git log --oneline -3

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          manifest-path: FreeCAD/pixi.toml
          cache: false
          locked: true

      # コンパイルの結果（ccache）を次の回に持ち越す。パッチが少し変わっただけなら、ビルドは数分〜十数分で済む
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.target }}-

      - name: Build FreeCAD
        shell: bash
        working-directory: FreeCAD
        env:
          TARGET_PLATFORM: ${{ matrix.target }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 3G
          CCACHE_COMPILERCHECK: content
          CCACHE_NOHASHDIR: "true"
        run: |
          set -euo pipefail
          python3 package/scripts/write_version_info.py ../freecad_version.txt
          pixi run --locked "bash package/bundle/build.sh"
          pixi run --locked ccache -s || true

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.target }}-${{ github.run_id }}

      - name: Get LibreDWG
        uses: actions/download-artifact@v4
        with:
          name: libredwg-bin
          path: libredwg-bin

      - name: Bundle and upload
        shell: bash
        working-directory: FreeCAD/package/bundle
        env:
          GH_TOKEN: ${{ github.token }}
          # create_bundle.sh は gh release upload を FreeCAD の clone の中で呼ぶ: 載せ先をこのリポジトリにする
          GH_REPO: ${{ github.repository }}
          TARGET_PLATFORM: ${{ matrix.target }}
          MAKE_INSTALLER: "true"
          # Windows は下の試験に通ってから載せる
          UPLOAD_RELEASE: ${{ runner.os == 'Windows' && 'false' || 'true' }}
          MACOS_SIGN_RELEASE: "0"
          WINDOWS_SIGN_RELEASE: "0"
        run: |
          set -euo pipefail
          # ファイル名に元の FreeCAD の版とコミットを入れる: FreeCAD_26.3.0dev-b48098e_ja-unified-0.2.0-Windows-x86_64...
          BASE_VERSION=$(python3 -c "import json; v=json.load(open('../../version.json')); print('%d.%d.%d%s' % (v['version_major'], v['version_minor'], v['version_patch'], v['version_suffix']))")
          export ASSET_VERSION="${BASE_VERSION}-${FREECAD_BASE:0:7}_${BUILD_TAG}"
          sed -i 's/^version_name="FreeCAD_${BUILD_TAG}-/version_name="FreeCAD_${ASSET_VERSION}-/' linux/create_bundle.sh windows/create_bundle.sh
          grep -n '^version_name=' linux/create_bundle.sh windows/create_bundle.sh
          # AppImage の更新の確認先を本家からこのリポジトリに（そのままだと本家の版に置き換わる）
          sed -i "s#gh-releases-zsync|FreeCAD|FreeCAD|#gh-releases-zsync|${GITHUB_REPOSITORY_OWNER}|${GITHUB_REPOSITORY#*/}|#" linux/create_bundle.sh
          grep -n "gh-releases-zsync" linux/create_bundle.sh
          # Windows: インストーラー（NSIS）はパスが 260 文字を超えると失敗する。リポジトリ名の分だけ本家より
          # 長いので、FreeCAD の clone を短いドライブ名に割り当ててそこから作る（約 50 文字短くなる）
          if [ "$RUNNER_OS" = Windows ]; then
            subst X: "$(cygpath -w "$GITHUB_WORKSPACE/FreeCAD")"
            cd /x/package/bundle
          fi
          # create_bundle.sh が同梱する dwg2dxf / dxf2dwg の場所（Windows の bash でも使える形のパス）
          LIBREDWG_BIN="$GITHUB_WORKSPACE/libredwg-bin/${{ matrix.libredwg }}"
          if [ "$RUNNER_OS" = Windows ]; then LIBREDWG_BIN=$(cygpath -u "$LIBREDWG_BIN"); fi
          export LIBREDWG_BIN
          export JWW_BIN="$LIBREDWG_BIN"
          ls -l "$LIBREDWG_BIN"
          pixi run --locked bash -c "cd ${{ matrix.osfolder }} && bash create_bundle.sh"

      # Windows: FreeCADCmd に日本語のパスを渡す試験（PowerShell から・cmd から・-- の後ろ・開くファイル・-c）。
      # 0.5.6 までは '--' の後ろの日本語のパスで "Unknown exception" になっていた
      - name: "Windows: Japanese paths on the command line"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmd = (Get-ChildItem FreeCAD\package\bundle\windows\FreeCAD_*-Windows-x86_64\bin\freecadcmd.exe).FullName
          ./patches/tests/windows_argv_smoke.ps1 -FreeCADCmd $cmd

      # Windows: 設定 → 標準 → ネットワーク の「適用」と同じ道筋を画面なしで（閉じたポート・応答の無いアドレス・システム・なし）。
      # 適用が 1 秒以内に戻る・画面のスレッドで通信も OS のプロキシの自動検出もしない・確認は別のスレッドで日本語の結果を返す。
      # 0.5.7/0.5.8 は Qt にシステムの設定（WinHTTP の WPAD）を使わせていて、会社のネットワークで「適用」が数分固まった
      - name: "Windows: applying the proxy settings does not wait"
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $cmd = (Get-ChildItem FreeCAD\package\bundle\windows\FreeCAD_*-Windows-x86_64\bin\freecadcmd.exe).FullName
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'fc-net-appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'fc-net-localappdata'
          $env:PYTHONIOENCODING = 'utf-8'
          $out = & $cmd -t TestNetworkSettings 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0 -or $out -notmatch '(?m)^OK') { throw "TestNetworkSettings failed (exit code $code)" }

      - name: "Windows: printing Japanese never fails, also with a legacy code page"
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $cmd = (Get-ChildItem FreeCAD\package\bundle\windows\FreeCAD_*-Windows-x86_64\bin\freecadcmd.exe).FullName
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'fc-print-appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'fc-print-localappdata'
          Remove-Item Env:PYTHONIOENCODING -ErrorAction SilentlyContinue
          $log = Join-Path $env:RUNNER_TEMP 'print-cp1252.txt'
          # The code page of a western Windows console; the text is Japanese (written as \u escapes here)
          cmd /c "chcp 1252 >nul & `"$cmd`" -c `"print('\u65e5\u672c\u8a9e\u30c6\u30b9\u30c8')`" > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content $log
          if ($code -ne 0) { throw "freecadcmd failed to print Japanese under cp1252 (exit code $code)" }

      - name: "Windows: upload"
        if: runner.os == 'Windows'
        shell: bash
        working-directory: FreeCAD/package/bundle/windows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l FreeCAD_*-Windows-x86_64.7z* FreeCAD_*-Windows-x86_64-installer.exe*
          gh release upload --clobber "$BUILD_TAG" FreeCAD_*-Windows-x86_64.7z FreeCAD_*-Windows-x86_64.7z-SHA256.txt \
            FreeCAD_*-Windows-x86_64-installer.exe FreeCAD_*-Windows-x86_64-installer.exe-SHA256.txt
